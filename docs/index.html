<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bassiet</title>
<meta name="description" content="A dark descent through 16 depths of Step 1 basic science: read, stain, duel.">
<meta name="color-scheme" content="dark light">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky header with five tabs, one working column. Concepts open as pages with five colour-coded subject lenses.
   Colour: signature orange on a cool ink-and-paper neutral. Five fixed subject hues carry through every screen. */
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface2:#E8EBF3; --line:#C6CCDC;
  --fg:#15182A; --muted:#566079;
  --accent:#F28A1B; --accent-ink:#1B1204; --accent-text:#A24B00; --accent-soft:#FFEBD2;
  --path:#6A45D1; --path-t:#5233B8; --path-s:#ECE6FB;
  --micro:#1F8A4C; --micro-t:#146B38; --micro-s:#DDF3E5;
  --pharm:#1F6FD6; --pharm-t:#1858B0; --pharm-s:#DCEAFB;
  --bio:#0E8C93; --bio-t:#0A6C72; --bio-s:#D5F0F1;
  --phys:#D43F63; --phys-t:#B02B4D; --phys-s:#FBE0E7;
  --good:#1B7A47; --bad:#B3261E;
  /* D01: control borders (3:1), focus ring, ink on good/bad fills, dimmed-but-readable text */
  --ctl:#7A8299; --focus:#A24B00; --good-ink:#FFFFFF; --bad-ink:#FFFFFF; --dim:#5E6680;
  --hdr:58px; --measure:720px;
  color-scheme:light;
  --display:'Pixelify Sans','Segoe UI',system-ui,sans-serif;
  --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141F; --surface:#1B1E2D; --surface2:#262A3D; --line:#383E57;
  --fg:#ECEEF7; --muted:#9CA3BE;
  --accent:#FFA040; --accent-ink:#1B1204; --accent-text:#FFB566; --accent-soft:#3A2810;
  --path:#9C84FF; --path-t:#B9A8FF; --path-s:#2A2350;
  --micro:#4FCB86; --micro-t:#7BDDA6; --micro-s:#17372A;
  --pharm:#5FA1FF; --pharm-t:#8DBBFF; --pharm-s:#142B4D;
  --bio:#3BC9D0; --bio-t:#6DDCE1; --bio-s:#12383A;
  --phys:#FF6F91; --phys-t:#FF9BB3; --phys-s:#4A1D2A;
  --good:#5BCB92; --bad:#F2837B; color-scheme:dark;
  --ctl:#6A7190; --focus:#FFA040; --good-ink:#0A0B0F; --bad-ink:#14070A; --dim:#8A90AA}}
:root[data-theme="dark"]{
  --bg:#12141F; --surface:#1B1E2D; --surface2:#262A3D; --line:#383E57;
  --fg:#ECEEF7; --muted:#9CA3BE;
  --accent:#FFA040; --accent-ink:#1B1204; --accent-text:#FFB566; --accent-soft:#3A2810;
  --path:#9C84FF; --path-t:#B9A8FF; --path-s:#2A2350;
  --micro:#4FCB86; --micro-t:#7BDDA6; --micro-s:#17372A;
  --pharm:#5FA1FF; --pharm-t:#8DBBFF; --pharm-s:#142B4D;
  --bio:#3BC9D0; --bio-t:#6DDCE1; --bio-s:#12383A;
  --phys:#FF6F91; --phys-t:#FF9BB3; --phys-s:#4A1D2A;
  --good:#5BCB92; --bad:#F2837B; color-scheme:dark;
  --ctl:#6A7190; --focus:#FFA040; --good-ink:#0A0B0F; --bad-ink:#14070A; --dim:#8A90AA}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.inner{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.head{display:flex;align-items:flex-end;gap:4px 24px;flex-wrap:wrap;padding-top:10px}
.brand{font:700 26px/1 var(--display);color:var(--accent-text);padding-bottom:8px;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;background:var(--accent);box-shadow:2px 2px 0 var(--line)}
nav#nav{display:flex;gap:2px;overflow-x:auto;max-width:100%;flex:1 1 300px;min-width:0}
nav#nav a{display:inline-flex;align-items:center;gap:6px;padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav#nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav#nav a:hover{color:var(--fg)}
.badge{font:500 11px/1 var(--mono);background:var(--accent);color:var(--accent-ink);padding:3px 6px}
main{padding-block:22px 72px}
h1{font:700 30px/1.15 var(--display);margin:0 0 4px;text-wrap:balance}
h2{font:700 20px/1.25 var(--display);margin:0 0 10px;text-wrap:balance}
h3{font:600 13px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.sub{color:var(--muted);margin:0 0 18px;max-width:62ch}
.mono{font-family:var(--mono);font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
:root[data-world="dive"] :focus-visible{box-shadow:0 0 0 5px rgba(255,154,60,.22)}
/* utilities: visually hidden text, skip link, scroll targets under the sticky header */
.vh,.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
.skip{position:fixed;left:12px;top:-60px;z-index:60;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 14px;border-radius:4px;text-decoration:none;transition:top .15s}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
#main h1,#main h2,#main h3,.sec,.quiz,.q,.fig,.panel{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 12px)}
/* headings and regions that receive focus from script (route change, new question) show no ring */
[tabindex="-1"]:focus{outline:none}
#main [tabindex="-1"]:focus:not(button):not(a):not(input):not(select):not(textarea){outline:none;box-shadow:none}
.boot{margin:48px 0 0;color:var(--muted);font:500 12px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.boot::after{content:"";display:inline-block;width:.6em;height:1em;margin-left:6px;vertical-align:-2px;background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.btn{appearance:none;border:2px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:4px;cursor:pointer;font-weight:600;box-shadow:0 2px 0 var(--line)}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 10px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:16px}
.notice{border:2px solid var(--accent);background:var(--accent-soft);color:var(--fg);border-radius:4px;padding:10px 14px;margin-bottom:16px}
.empty{border:2px dashed var(--line);border-radius:4px;padding:18px;color:var(--muted)}
.empty strong{color:var(--fg);font-size:inherit;font-weight:600}
.chip{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--surface2);color:var(--muted);padding:4px 7px;border-radius:2px;white-space:nowrap}
.chip.d-path{background:var(--path-s);color:var(--path-t)}.chip.d-micro{background:var(--micro-s);color:var(--micro-t)}.chip.d-pharm{background:var(--pharm-s);color:var(--pharm-t)}.chip.d-bio{background:var(--bio-s);color:var(--bio-t)}.chip.d-phys{background:var(--phys-s);color:var(--phys-t)}
.chip.acc{background:var(--accent-soft);color:var(--accent-text)}

.ledger{display:flex;flex-wrap:wrap;border-block:2px solid var(--line);margin:16px 0 4px}
.ledger>div{flex:1 1 120px;padding:10px 16px 10px 0}
.ledger b{display:block;font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.ledger span{font-size:13px;color:var(--muted)}

/* coverage grid */
.gridwrap{overflow-x:auto;border:2px solid var(--line);border-radius:4px;background:var(--surface)}
table.cov{border-collapse:collapse;width:100%;min-width:520px}
table.cov th{font:600 12px var(--body);color:var(--muted);padding:8px 6px;text-align:center;letter-spacing:.04em}
table.cov th.rl{text-align:left;padding-left:12px;white-space:nowrap}
table.cov td{padding:3px}
table.cov button{appearance:none;width:100%;height:34px;border:0;border-radius:2px;cursor:pointer;font:500 13px var(--mono);color:var(--fg);background:var(--surface2)}
table.cov button:hover{outline:2px solid var(--accent)}
table.cov button:focus-visible{outline:3px solid var(--focus);outline-offset:1px;position:relative;z-index:1}
.d-path-bg{--h:var(--path);background:var(--path)!important}.d-micro-bg{--h:var(--micro);background:var(--micro)!important}.d-pharm-bg{--h:var(--pharm);background:var(--pharm)!important}.d-bio-bg{--h:var(--bio);background:var(--bio)!important}.d-phys-bg{--h:var(--phys);background:var(--phys)!important}
/* t09-08/t09-30: filled cells are a tint of the subject hue under solid text (no element opacity, which also
   faded the numbers). Callers may pass --lv (0..1) for intensity; inline opacity is neutralised. */
table.cov{table-layout:fixed}
table.cov th.rl{width:132px}
table.cov button.has{opacity:1!important;font-weight:700}
table.cov button.has[class*="-bg"]{color:var(--fg);background:color-mix(in srgb,var(--h) calc(30% + var(--lv,.5) * 30%),var(--surface2))!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 70%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) table.cov button.has[class*="-bg"]{background:color-mix(in srgb,var(--h) calc(16% + var(--lv,.5) * 28%),var(--surface2))!important}}
:root[data-theme="dark"] table.cov button.has[class*="-bg"],:root[data-world="dive"] table.cov button.has[class*="-bg"]{background:color-mix(in srgb,var(--h) calc(16% + var(--lv,.5) * 28%),var(--surface2))!important}
:root[data-world="dive"] table.cov button.has{text-shadow:0 1px 2px rgba(0,0,0,.6)}
:root[data-world="dive"] table.cov button:not(.has){background:#111319;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border-bottom:0}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--accent-text);font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* atlas */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.search{background:var(--surface);border:2px solid var(--ctl);border-radius:4px;padding:7px 12px;min-width:200px;flex:1 1 220px}
select.sel{background:var(--surface);border:2px solid var(--ctl);border-radius:4px;padding:7px 10px}
.search::placeholder,textarea::placeholder,input::placeholder{color:var(--muted);opacity:1}
.crow{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;width:100%;appearance:none;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.crow:hover{border-color:var(--accent)}
.crow .nm{font-weight:600;flex:1 1 220px;min-width:0}
.dots{display:flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:2px;background:var(--surface2);display:block}
.dots i.d-path{background:var(--path)}.dots i.d-micro{background:var(--micro)}.dots i.d-pharm{background:var(--pharm)}.dots i.d-bio{background:var(--bio)}.dots i.d-phys{background:var(--phys)}
.conf{font:500 11px var(--mono);color:var(--muted);min-width:46px;text-align:right}
.lens{border-left:6px solid var(--line);background:var(--surface);padding:10px 14px;margin-bottom:8px;border-radius:0 4px 4px 0}
.lens h3,.lens h4{margin:0 0 3px;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase}
.lens p{margin:0}
.lens.d-path{border-color:var(--path)}.lens.d-path h4{color:var(--path-t)}
.lens.d-micro{border-color:var(--micro)}.lens.d-micro h4{color:var(--micro-t)}
.lens.d-pharm{border-color:var(--pharm)}.lens.d-pharm h4{color:var(--pharm-t)}
.lens.d-bio{border-color:var(--bio)}.lens.d-bio h4{color:var(--bio-t)}
.lens.d-phys{border-color:var(--phys)}.lens.d-phys h4{color:var(--phys-t)}
.lens.missing{border-style:dashed;border-left-style:solid;background:transparent;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--ctl);border-radius:4px;overflow:visible}
.seg button{appearance:none;border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted);position:relative;white-space:nowrap}
.seg button:first-child{border-radius:2px 0 0 2px}.seg button:last-child{border-radius:0 2px 2px 0}
.seg button:focus-visible{outline-offset:-4px;z-index:1;box-shadow:none}
.seg button[aria-pressed="true"]:focus-visible,.fbtn[aria-pressed="true"]:focus-visible,.arrows button[aria-pressed="true"]:focus-visible{outline-color:var(--fg)}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
svg.web{width:100%;height:auto;max-height:420px;display:block}
svg.web text{font:600 12px var(--body);fill:var(--fg)}
svg.web .edge{stroke:var(--line);stroke-width:2}
svg.web .nd{fill:var(--surface);stroke:var(--line);stroke-width:2}
svg.web g.hit{cursor:pointer}
svg.web g.hit:hover .nd{stroke:var(--accent)}
svg.web .ctr{fill:var(--accent);stroke:var(--accent)}
svg.web .ctr-t{fill:var(--accent-ink)}
.conn{list-style:none;margin:8px 0 0;padding:0}
.conn li{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.conn li:last-child{border-bottom:0}
textarea.note{width:100%;min-height:84px;background:var(--bg);border:2px solid var(--ctl);border-radius:4px;padding:8px 10px;resize:vertical}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0 8px}
.mode{appearance:none;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 0 var(--line)}
.mode:hover{border-color:var(--accent)}
.mode b{font:700 18px var(--display)}
.mode span{color:var(--muted);font-size:14px}
.mode .n{font:500 12px var(--mono);color:var(--accent-text)}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:20px;max-width:780px}
.stage .q{font:700 21px/1.3 var(--display);margin:8px 0 0;text-wrap:balance}
.prog{height:8px;background:var(--surface2);max-width:780px;margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--accent)}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:2px solid var(--line);border-radius:4px;background:var(--bg);margin:6px 0;width:100%;text-align:left}
button.step{cursor:pointer;appearance:none}
button.step:hover{border-color:var(--accent)}
.step .no{font:700 13px var(--mono);color:var(--accent-text);min-width:22px}
.step.given{background:var(--surface2)}
/* t09-05: right/wrong never by colour alone: wrong is dashed and tinted; callers may add .mark (✓/✕) */
.step.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--bg))}
.step.no-ok{border-color:var(--bad);border-style:dashed;background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.step .mark{margin-left:auto;flex:none;font:700 13px var(--mono);letter-spacing:.06em}
.step.ok .mark{color:var(--good)}.step.no-ok .mark{color:var(--bad)}
.arrows{display:flex;gap:6px;flex:none}
.arrows button{appearance:none;width:44px;height:36px;border:2px solid var(--ctl);background:var(--surface);border-radius:4px;cursor:pointer;font:700 18px var(--mono);color:var(--muted)}
.arrows button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* t09-06: ink on the fills passes AA in every theme; wrong pick also gets a strike so it is not colour-only */
.arrows button.right{border-color:var(--good);background:var(--good);color:var(--good-ink)}
.arrows button.wrong{border-color:var(--bad);border-style:dashed;background:var(--bad);color:var(--bad-ink);text-decoration:line-through;text-decoration-thickness:2px}
.pres{font:600 12px var(--mono);letter-spacing:.06em;flex-basis:100%}
.pres.ok{color:var(--good)}.pres.bad{color:var(--bad)}
.prow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{appearance:none;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:4px;padding:10px 12px;cursor:pointer;display:flex;align-items:baseline;gap:8px;width:100%}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
/* t09-36: answered options are tinted, and the ✓/✕ mark sits at the right edge, larger */
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--bg))}
.opt.bad{border-color:var(--bad);border-style:dashed;background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.opt>.mono:not(.key):last-child,.opt .res{margin-left:auto;padding-left:8px;font:700 17px var(--mono);flex:none}
.opt.ok>.mono:not(.key):last-child,.opt.ok .res{color:var(--good)}.opt.bad>.mono:not(.key):last-child,.opt.bad .res{color:var(--bad)}
.stage img{display:block;max-width:100%;max-height:460px;margin:10px auto 0;background:var(--surface2)}
.pearl{margin-top:14px;padding:10px 12px;background:var(--accent-soft);border-radius:4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface2);display:block}
.tile .tb{padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tile summary{cursor:pointer;color:var(--accent-text);font-weight:600}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0 16px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{background:var(--bg);border:2px solid var(--ctl);border-radius:4px;padding:8px 10px;font-weight:400;color:var(--fg);width:100%}
label.f textarea{min-height:84px;resize:vertical}
.hbar{display:grid;grid-template-columns:minmax(110px,190px) 1fr 28px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.hbar .t{height:10px;background:var(--surface2)}
.hbar .t i{display:block;height:100%;background:var(--accent)}
.hbar b{font:500 12px var(--mono);text-align:right}
.lc{padding:12px 0;border-bottom:1px solid var(--line)}
.lc .top{display:flex;gap:10px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.lc .front{font-weight:600;margin:0 0 4px}
.lc .back{margin:0 0 8px;color:var(--muted)}
#hint{position:fixed;z-index:50;max-width:260px;background:var(--fg);color:var(--bg);padding:8px 10px;border-radius:4px;font-size:13px;pointer-events:none;box-shadow:3px 3px 0 var(--accent)}
#hint[hidden]{display:none}
#hint b{display:block;margin-bottom:2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:4px;z-index:46;max-width:min(560px,calc(100vw - 32px));width:max-content;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
/* contract 2.1: error toasts (CT.toast(msg,'err')) — styled on #toast.err and .toast.err */
#toast.err,.toast.err{background:var(--bad);color:var(--bad-ink);border-left:6px solid color-mix(in srgb,var(--bad) 55%,#000)}
#toast.err::before,.toast.err::before{content:"✕";font:700 13px var(--mono);margin-right:10px}

/* ===== The dive: world look ===== */
:root[data-world="dive"]{
  --bg:#0A0B0F; --surface:#13151C; --surface2:#1C1F29; --line:#2A2E3B;
  --fg:#E7E2D8; --muted:#A09B8F;
  --accent:#FF9A3C; --accent-ink:#1A0F04; --accent-text:#FFB467; --accent-soft:#2C1C0D;
  --path:#9C84FF; --path-t:#BCADFF; --path-s:#231D40;

  --pharm:#5FA1FF; --pharm-t:#93BEFF; --pharm-s:#11264A;
  --bio:#3BC9D0; --bio-t:#74DDE2; --bio-s:#0F3234;
  --phys:#FF6F91; --phys-t:#FFA0B6; --phys-s:#3E1824;
  --good:#5BCB92; --bad:#F2837B; color-scheme:dark;
  --ctl:#5E6479; --focus:#FF9A3C; --good-ink:#0A0B0F; --bad-ink:#14070A; --dim:#8A857A}
:root[data-world="dive"] body{background:radial-gradient(ellipse 90% 60% at 50% 0%,#1A140D 0%,var(--bg) 60%) fixed var(--bg)}
/* t01-01/t09-01: a backdrop-filter on header.band makes it the containing block of the fixed phone nav,
   which then sat at the top over the brand. The blur lives on a pseudo-element instead; the header itself
   carries no filter, so position:fixed children are relative to the viewport again. */
:root[data-world="dive"] header.band{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
:root[data-world="dive"] header.band::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:rgba(10,11,15,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
:root[data-world="dive"] body::before{background:rgba(10,11,15,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
:root[data-world="dive"] .brand{color:var(--accent);text-shadow:0 0 14px rgba(255,154,60,.45)}
#pall{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
:root:not([data-world="dive"]) #pall{display:none}
header.band{z-index:20} main{position:relative;z-index:1}
.console{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 12px var(--mono);letter-spacing:.12em;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:14px}
.console span:first-child{color:var(--accent-text)}

.tx.from-hale .txh span:first-child{color:var(--accent-text)}
.tx.from-probe{border-left-color:var(--bio)}.tx.from-probe .txh span:first-child{color:var(--bio-t)}
.tx.from-static{border-left-color:var(--muted)}.tx.from-static p{font-family:var(--mono);font-size:14px;color:var(--muted)}
.tx.from-host{border-left-color:var(--phys)}.tx.from-host .txh span:first-child{color:var(--phys-t)}
.tx.from-pall{border-left-color:#8A877F;background:#0E0E10}.tx.from-pall p{color:#C9C5BC;letter-spacing:.02em}

.shaft li.locked .dicon{opacity:.4;filter:grayscale(1)}

/* t01-05/t09-34: the lamp sticks exactly under the header (--hdr is measured from header.band) */
.lamp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px}

.cloudbtn[data-state="ok"]{color:var(--accent-text,var(--accent))}
.cloudbtn[data-state="error"],.cloudbtn[data-state="tap"]{border-color:var(--accent)}
.cloudsheet{max-width:520px;width:calc(100% - 32px);border:2px solid var(--line);border-radius:4px;background:var(--surface);color:var(--text);padding:18px}
.cloudsheet::backdrop{background:rgba(0,0,0,.6)}
.cloudsheet h2{margin:0 0 8px}
.cloudrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.cloudrow button{min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);cursor:pointer}
.cloudrow button[data-c="connect"]{background:var(--accent);color:#111;border-color:var(--accent)}
</style>
